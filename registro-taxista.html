<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Registro de transportista | LANZEC MOTO EXPRESS</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/nav.js"></script>
</head>
<body data-page="register-transporter">
<header class="topbar">
  <a class="brand" href="index.html">LANZEC <span>MOTO EXPRESS</span></a>
  <nav>
    <a class="btn ghost small" href="index.html">Inicio</a>
    <a class="btn ghost small" data-auth="out" href="login.html">Iniciar sesión</a>
    <a class="btn small" data-auth="out" href="registro-cliente.html">Crear cuenta</a>
    <a class="btn ghost small" data-auth="in" data-panel href="login.html">Mi panel</a>
    <a class="btn ghost small" data-auth="in" href="suscripcion.html">Suscripciones</a>
    <a class="btn ghost small" data-auth="in" href="reclamos.html">Reclamos</a>
    <button class="btn danger small" data-auth="in" data-logout>Cerrar sesión</button>
  </nav>
</header>
<div id="notice" class="notice" hidden></div>
<main class="shell">
<section class="card"><h1>Registro de transportista</h1><p class="muted">Tu cuenta deberá ser aprobada por administración antes de recibir solicitudes.</p><form id="registerForm"><div class="grid"><label>Nombre completo<input name="full_name" required maxlength="120"></label><label>Edad<input name="age" type="number" min="18" max="100" required></label><label>DNI (8 dígitos)<input name="dni" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" required></label><label>Celular<input name="phone" type="tel" required maxlength="20"></label><label>Correo electrónico<input name="email" type="email" required autocomplete="email"></label><label>Contraseña<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar contraseña<input name="confirm_password" type="password" minlength="8" required autocomplete="new-password"></label><label>Foto de perfil (máx. 5 MB)<input name="profile_photo" type="file" accept="image/*"></label><label>Marca y modelo de moto<input name="motorcycle" required maxlength="100" placeholder="Ej. Honda Wave 110"></label><label>Placa<input name="plate" required maxlength="12"></label><label>Color de moto<input name="motorcycle_color" required maxlength="40"></label></div><fieldset class="card"><legend>Tipo de servicio que ofreces</legend><div class="checkrow"><label><input type="checkbox" name="service_types" value="mototaxi"> Mototaxi</label><label><input type="checkbox" name="service_types" value="delivery"> Delivery</label></div><small>Selecciona uno o ambos.</small></fieldset><button class="btn" type="submit">Crear cuenta y elegir suscripción</button></form></section>
</main>
<footer class="footer">© 2026 LANZEC MOTO EXPRESS · Juliaca, Perú</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
